name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      # The browser build follows the locked playwright version.
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # Still runs on a cache hit: the apt system deps are not cached.
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      # repo-check runs once in CI, in the independently required compliance
      # status. The hook stays for local feedback before push.
      - name: Run pre-commit
        env:
          SKIP: repo-check
        run: uv run pre-commit run --all-files

      - name: Run pytest
        run: uv run pytest

      - name: Build package
        run: uv build
