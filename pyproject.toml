[project]
name = "resume-toolkit"
version = "0.5.0"
description = "Validate JSON Resume content and render HTML, PDF, JSON, Markdown and static sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/resume_toolkit/assets/themes/classic/fonts/LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.4",
    # [format] pulls the validators that make `format: uri` / `format: email`
    # actually enforceable rather than decorative.
    "jsonschema[format]>=4.23.0",
    "playwright>=1.49.0",
    "typer>=0.15.1",
    "pypdf>=5.1.0",
    "codespell>=2.4.3",
]

[project.urls]
Homepage = "https://github.com/JayTeeBat/resume-toolkit"
Repository = "https://github.com/JayTeeBat/resume-toolkit"
Documentation = "https://github.com/JayTeeBat/resume-toolkit/tree/main/docs"

[project.scripts]
resume = "resume_toolkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "detect-secrets>=1.5.0",
    "pre-commit>=4.0.0",
    "pre-commit-hooks>=5.0.0",
    "pymarkdownlnt>=0.9.39",
    "ruff>=0.6.0",
    "ty>=0.0.1a16",
    "actionlint-py>=1.7.12.25",
    "zizmor>=1.31.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["examples/**", "tests/**", "docs/**"]

[tool.codespell]
# Vendored/generated content is not ours to spell-check.
skip = "./.git,./.venv,./dist,./src/resume_toolkit/assets/schema,./src/resume_toolkit/assets/themes/classic/fonts,./uv.lock"

[tool.repo-standard]
profile = "python-single"
standard = "2"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: drives a real Chromium; deselect with -m 'not slow'",
]

[tool.ty.src]
include = ["src", "tests"]
